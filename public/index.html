<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f4bfd6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Blob Brawl</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;800&family=Bangers&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script type="importmap">{"imports":{"three":"/three/build/three.module.js"}}</script>
</head>
<body>
<canvas id="game"></canvas>
<div id="vignette"></div>

<!-- ================= MAIN MENU ================= -->
<section id="menu" class="screen">
  <div class="panel">
    <h1 class="logo">BLOB <br>BRAWL</h1>
    <input id="name" maxlength="14" autocomplete="off" spellcheck="false">
    <nav class="list">
      <button id="btnQuick" data-i="quick"></button>
      <button id="btnCreate" data-i="create"></button>
      <div class="joinrow"><input id="code" maxlength="4" placeholder="ABCD" autocomplete="off" spellcheck="false"><button id="btnJoin" data-i="join"></button></div>
      <button id="btnPractice" data-i="practice"></button>
      <button id="btnCostume" data-i="costume"></button>
      <button id="btnHelp" data-i="controls"></button>
      <button id="btnSettings" data-i="settings"></button>
    </nav>
    <p id="menuMsg" class="msg"></p>
  </div>
</section>

<!-- ================= COSTUME ================= -->
<section id="costume" class="screen hidden">
  <div class="panel wide">
    <div class="phead"><h2 data-i="costume"></h2><button id="costDone" class="pill" data-i="done"></button></div>
    <div id="custTabs" class="tabs"></div>
    <div id="custOpts" class="grid"></div>
    <div class="row"><button id="custRand" class="pill">🎲 <span data-i="random"></span></button></div>
  </div>
  <div class="hint" data-i="dragHint"></div>
</section>

<!-- ================= LOBBY ================= -->
<section id="lobby" class="screen hidden">
  <div class="topbar">
    <button id="btnLeave" class="pill">✕ <span data-i="leave"></span></button>
    <div class="code"><small data-i="roomCode"></small><b id="roomCode">----</b><button id="btnCopy" class="pill">🔗 <span data-i="copyLink"></span></button></div>
    <button id="btnLobbyCostume" class="pill">👕 <span data-i="costume"></span></button>
  </div>
  <div class="panel lobbypanel">
    <div id="stageGrid" class="stages"></div>
    <div class="opts">
      <div class="opt"><span data-i="mode"></span><div class="seg" id="modeSeg"><button data-mode="melee" data-i="melee"></button><button data-mode="gang" data-i="gang"></button></div></div>
      <div class="opt"><span data-i="winsNeeded"></span><div class="seg" id="winsSeg"><button data-wins="1">1</button><button data-wins="3">3</button><button data-wins="5">5</button><button data-wins="7">7</button></div></div>
      <div class="opt"><span data-i="bots"></span><div class="seg"><button id="botMinus">−</button><b id="botCount">0</b><button id="botPlus">+</button></div></div>
    </div>
    <div class="row">
      <button id="btnTeam" class="pill hidden" data-i="switchTeam"></button>
      <button id="btnReady" class="go alt" data-i="ready"></button>
      <button id="btnStart" class="go" data-i="start"></button>
    </div>
    <p id="lobbyMsg" class="msg"></p>
    <div class="chat"><div id="chatLog"></div><div class="row"><input id="chatIn" maxlength="100" autocomplete="off"><button id="chatSend" class="pill">➤</button></div></div>
  </div>
</section>

<!-- ================= HUD ================= -->
<div id="hud" class="hidden">
  <div id="score"></div>
  <button id="btnMenu" class="hudbtn">☰</button>
  <button id="btnEmote" class="hudbtn second">😜</button>
  <div id="ping"></div>
  <div id="banner"></div>
  <div id="big"></div>
  <div id="spectate" class="hidden" data-i="spectating"></div>
  <div id="emotebar"></div>
  <div id="keys"></div>
  <div id="rotate" data-i="rotate"></div>
</div>

<!-- ================= TOUCH ================= -->
<div id="touch" class="hidden">
  <div id="stick"><div id="knob"></div></div>
  <div class="tb" id="tJump"><b>⤒</b><small data-i="bJump"></small></div>
  <div class="tb" id="tPunch"><b>👊</b><small data-i="bPunch"></small></div>
  <div class="tb latch" id="tGrab"><b>✋</b><small data-i="bGrab"></small></div>
  <div class="tb latch" id="tLift"><b>🙌</b><small data-i="bLift"></small></div>
  <div class="tb" id="tKick"><b>🦵</b><small data-i="bKick"></small></div>
  <div class="tb" id="tButt"><b>💥</b><small data-i="bButt"></small></div>
</div>

<div id="modal" class="hidden"><div class="mcard" id="modalBody"></div></div>
<div id="toast"></div>

<script src="js/audio.js"></script>
<script src="js/input.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
